<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>TPLAY — Film & Series</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#151b26;--muted:#9ba3b2;--line:#293140;--gold:#e8bd55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6f8;font:15px/1.5 Inter,system-ui,Arial}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#090b10ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}nav{max-width:1240px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:25px}.logo{font-size:25px;font-weight:900}.logo b{color:var(--gold)}.links{display:flex;gap:18px;color:#c6cad2}.links a:hover{color:var(--gold)}.search{margin-left:auto;background:#171d28;border:1px solid #30394a;border-radius:30px;padding:7px 13px;width:min(300px,40vw);display:flex;gap:8px}.search input{background:none;border:0;outline:0;color:white;width:100%}.wrap{max-width:1240px;margin:auto;padding:25px 22px 65px}.hero{min-height:260px;padding:30px;display:flex;align-items:end;border:1px solid #303444;border-radius:17px;background:linear-gradient(90deg,#090b10 0%,#090b10dc 45%,#090b1030),radial-gradient(ellipse at 80% 20%,#806333,#29354d 55%,#11151e)}.hero small{color:var(--gold);font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:8px 0}.hero p{color:#c4c9d2;max-width:520px}.btn{background:var(--gold);color:#17130a;border:0;border-radius:8px;padding:10px 16px;font-weight:800}.section{margin-top:32px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:21px}.head span,.meta{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 14px}.poster{min-width:0;cursor:pointer}.poster img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:9px;background:#1b2230;display:block;transition:.2s}.poster:hover img{transform:translateY(-4px);filter:brightness(1.1)}.poster h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0 2px}.tag{border:1px solid #3a414d;border-radius:4px;padding:1px 5px;margin-right:5px}.loading,.error,.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px}.detail{display:grid;grid-template-columns:245px 1fr;gap:26px}.detail>img{width:100%;border-radius:10px}.detail h1{font-size:clamp(26px,4vw,40px);margin:4px 0 10px}.detail p{color:#c2c7d1}.chips,.episodes,.sources{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.chips span,.episodes button,.source{border:1px solid #343d4d;background:#1a202c;color:#eee;border-radius:7px;padding:7px 11px}.episodes button:hover,.source:hover{border-color:var(--gold)}.player{aspect-ratio:16/9;width:100%;background:#000;border:1px solid var(--line);border-radius:10px}.player iframe{width:100%;height:100%;border:0}.foot{text-align:center;padding:25px;color:#778091;border-top:1px solid var(--line);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){nav{padding:12px 14px;gap:13px;flex-wrap:wrap}.logo{font-size:22px}.links{order:3;width:100%;overflow:auto}.search{width:45vw}.wrap{padding:17px 14px 50px}.hero{min-height:220px;padding:20px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 10px}.poster h3{font-size:12px}.detail{grid-template-columns:112px 1fr;gap:14px}.detail h1{font-size:21px}}
</style></head><body><header class="top"><nav><a class="logo" href="/">T<b>PLAY</b></a><div class="links"><a href="/" data-tab="home">Beranda</a><a href="/?tab=movies" data-tab="movies">Film</a><a href="/?tab=series" data-tab="series">Serial</a><a href="/?tab=popular" data-tab="popular">Populer</a></div><form class="search" id="searchForm">⌕ <input id="searchInput" placeholder="Cari film atau serial…"></form></nav></header><main class="wrap" id="app"><div class="loading">Memuat katalog…</div></main><footer class="foot">TPLAY · Katalog film dan serial · Sumber data pihak ketiga</footer>
<script>
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=s=>s&&s!=='https:undefined'?s:'https://placehold.co/400x600/171c27/9299a8?text=TPLAY';
async function api(p){const r=await fetch(p);if(!r.ok)throw Error('Sumber mengembalikan HTTP '+r.status);const d=await r.json();if(d===null)throw Error('Sumber sedang tidak bisa mengambil data.');return d}
function cards(items){if(!Array.isArray(items)||!items.length)return '<div class="empty">Belum ada judul yang bisa ditampilkan.</div>';return '<div class="grid">'+items.map(x=>'<article class="poster" data-type="'+esc(x.type||'movie')+'" data-id="'+esc(x._id)+'"><img loading="lazy" src="'+esc(img(x.posterImg))+'" alt="'+esc(x.title)+'"><h3>'+esc(x.title)+'</h3><div class="meta">'+(x.rating?'<span class="tag">★ '+esc(x.rating)+'</span>':'')+(x.type==='series'?'Serial':'Film')+(x.episode?' · Ep '+esc(x.episode):'')+'</div></article>').join('')+'</div>'}
function section(title,items,sub=''){return '<section class="section"><div class="head"><h2>'+title+'</h2><span>'+sub+'</span></div>'+cards(items)+'</section>'}
async function home(){app.innerHTML='<div class="hero"><div><small>YOUR MOVIE DESTINATION</small><h1>Temukan tontonan<br>favoritmu.</h1><p>Jelajahi film dan serial terbaru dari berbagai genre.</p><button class="btn" onclick="document.getElementById(\'catalog\').scrollIntoView({behavior:\'smooth\'})">Jelajahi katalog</button></div></div><div id="catalog" class="loading">Mengambil katalog…</div>';const r=await Promise.allSettled([api('/movies'),api('/series'),api('/popular/movies')]);let out='';if(r[0].status==='fulfilled')out+=section('Film Terbaru',r[0].value.slice(0,18),'Update terbaru');if(r[1].status==='fulfilled')out+=section('Serial Terbaru',r[1].value.slice(0,12),'Episode terbaru');if(r[2].status==='fulfilled')out+=section('Film Populer',r[2].value.slice(0,12),'Pilihan populer');const el=document.getElementById('catalog');el.className='';el.innerHTML=out||'<div class="error">Katalog belum dapat dimuat. Coba lagi nanti.</div>'}
async function listing(t){app.innerHTML='<div class="loading">Memuat…</div>';try{const d=await api(t==='series'?'/series':t==='popular'?'/popular/movies':'/movies');app.innerHTML=section(t==='series'?'Serial Terbaru':t==='popular'?'Film Populer':'Film Terbaru',d)}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function search(q){app.innerHTML='<div class="loading">Mencari '+esc(q)+'…</div>';try{app.innerHTML=section('Hasil pencarian',await api('/search/'+encodeURIComponent(q)),'“'+esc(q)+'”')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function detail(t,id){app.innerHTML='<div class="loading">Memuat detail…</div>';try{const d=await api('/'+(t==='series'?'series':'movies')+'/'+encodeURIComponent(id));app.innerHTML='<div class="detail"><img src="'+esc(img(d.posterImg))+'" alt="'+esc(d.title)+'"><div><div class="meta">'+(t==='series'?'SERIAL':'FILM')+' · '+esc(d.releaseDate||'')+'</div><h1>'+esc(d.title)+'</h1><div class="meta">★ '+esc(d.rating||'-')+' · '+esc(d.duration||'')+'</div><div class="chips">'+(d.genres||[]).map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><p>'+esc(d.synopsis||'Sinopsis belum tersedia.')+'</p><div class="meta">Sutradara: '+esc((d.directors||[]).join(', ')||'-')+'<br>Pemeran: '+esc((d.casts||[]).join(', ')||'-')+'</div>'+(t==='series'?'<h3>Pilih episode</h3><div class="episodes" id="episodes"></div>':'<div class="episodes"><button class="btn" id="watch">▶ Tonton sekarang</button></div>')+'</div></div><div id="watchArea"></div>';if(t==='series'){const box=document.getElementById('episodes');(d.seasons||[]).forEach(s=>{for(let n=1;n<=Math.min(s.totalEpisodes||0,100);n++){const b=document.createElement('button');b.textContent='S'+s.season+' E'+n;b.onclick=()=>watch(t,id,s.season,n);box.appendChild(b)}})}else document.getElementById('watch').onclick=()=>watch(t,id,1,1)}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function watch(t,id,s,e){const area=document.getElementById('watchArea');area.innerHTML='<section class="section"><h2>Memuat sumber pemutar…</h2><div class="loading">Mohon tunggu</div></section>';try{const p='/'+(t==='series'?'series':'movies')+'/'+encodeURIComponent(id)+'/streams'+(t==='series'?'?season='+s+'&episode='+e:'');const data=await api(p);if(!data.length){area.innerHTML='<div class="error">Sumber streaming belum tersedia.</div>';return}area.innerHTML='<section class="section"><h2>▶ Sedang diputar</h2><div class="player" id="player"><div class="empty">Pilih server di bawah untuk menonton.</div></div><div class="sources">'+data.map((x,i)=>'<button class="source" data-index="'+i+'">'+esc(x.provider||'Server '+(i+1))+' '+esc((x.resolutions||[]).join(' '))+'</button>').join('')+'</div></section>';area.querySelectorAll('.source').forEach(b=>b.onclick=()=>{const x=data[Number(b.dataset.index)];document.getElementById('player').innerHTML='<iframe allowfullscreen referrerpolicy="no-referrer" src="'+esc(x.url)+'"></iframe>'})}catch(e){area.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const q=document.getElementById('searchInput').value.trim();if(q)search(q)};
document.querySelectorAll('[data-tab]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=a.dataset.tab;t==='home'?home():listing(t)});
app.addEventListener('click',e=>{const c=e.target.closest('.poster');if(c)detail(c.dataset.type,c.dataset.id)});
const p=location.pathname.split('/').filter(Boolean);if(p[0]==='title'&&p[1]&&p[2])detail(p[1],decodeURIComponent(p.slice(2).join('/')));else{const tab=new URLSearchParams(location.search).get('tab');if(['series','movies','popular'].includes(tab))listing(tab);else home()}
</script></body></html>
